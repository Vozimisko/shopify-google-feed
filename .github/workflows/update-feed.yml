name: Update Shopify feed
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
concurrency:
  group: update-shopify-feed
  cancel-in-progress: false
jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Generate feeds
        run: python generate_feed.py
      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed_ga.tsv feed_mc.tsv
          git diff --staged --quiet && echo "No feed changes." && exit 0
          git commit -m "Update product feeds ($(date -u +'%Y-%m-%d'))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Report feed sizes
        if: always()
        run: |
          for f in feed_ga.tsv feed_mc.tsv; do
            if [ -f "$f" ]; then
              echo "$f: $(( $(wc -l < "$f") - 1 )) rows"
            else
              echo "$f: MISSING"
            fi
          done
